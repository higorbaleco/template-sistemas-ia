<!-- @dsCard group="Brand" viewport="1200x500" name="Wordmark & Logo" subtitle="Official brand assets — white, black, cyan variants" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:20px;color:var(--t1);font-family:var(--font-ui);overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:16px}
.tile{border-radius:16px;border:1px solid var(--gbo);padding:16px;display:flex;align-items:center;justify-content:center;min-height:140px}
.tile.dark{background:#0E1513;border-color:rgba(255,255,255,0.09)}
.tile.light{background:#FFFFFF}
img{max-width:100%;max-height:100%;object-fit:contain}</style></head><body>
<div style="margin-bottom:20px">
<div class="h3">Wordmark & Logo Variants</div>
<div class="tk" style="color:var(--t2);margin-top:4px">Official Avraham Digital brand assets in light and dark contexts</div>
</div>
<div class="grid">
<div>
<div class="tk" style="margin-bottom:8px;color:var(--t3)">White on dark</div>
<div class="tile dark"><img src="../uploads/01.png" alt="Avraham logo white on dark"></div>
</div>
<div>
<div class="tk" style="margin-bottom:8px;color:var(--t3)">Black on light</div>
<div class="tile light"><img src="../uploads/03 fundo branco letra preta.png" alt="Avraham logo black on white"></div>
</div>
<div>
<div class="tk" style="margin-bottom:8px;color:var(--t3)">Cyan accent (dark)</div>
<div class="tile dark"><img src="../uploads/04 fundo branco letra verde.png" alt="Avraham logo cyan on dark"></div>
</div>
</div>
</body></html>
