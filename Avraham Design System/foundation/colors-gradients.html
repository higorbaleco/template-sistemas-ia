<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:22px;color:var(--t1);font-family:var(--font-ui)}
.sw{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap}
.chip{border-radius:14px;border:1px solid var(--gbo);overflow:hidden;min-width:150px;flex:1}
.chip .cap{height:66px}.chip .meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px;background:var(--gb)}
.hex{font-family:var(--font-ui);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.nm{font-size:12px;font-weight:700;color:var(--t1)}
.tk{font-size:11px;color:var(--t2)}</style></head><body>
<div class="sw">
<div style="height:60px;border-radius:14px;background:var(--grad-flow);border:1px solid var(--gbo)"></div>
<div class="row" style="gap:10px">
<div style="flex:1"><div style="height:48px;border-radius:12px;background:var(--grad-step-1)"></div><div class="tk" style="margin-top:6px;text-align:center">step 1</div></div><div style="flex:1"><div style="height:48px;border-radius:12px;background:var(--grad-step-2)"></div><div class="tk" style="margin-top:6px;text-align:center">step 2</div></div><div style="flex:1"><div style="height:48px;border-radius:12px;background:var(--grad-step-3)"></div><div class="tk" style="margin-top:6px;text-align:center">step 3</div></div><div style="flex:1"><div style="height:48px;border-radius:12px;background:var(--grad-step-4)"></div><div class="tk" style="margin-top:6px;text-align:center">step 4</div></div><div style="flex:1"><div style="height:48px;border-radius:12px;background:var(--grad-step-5)"></div><div class="tk" style="margin-top:6px;text-align:center">step 5</div></div>
</div></div></body></html>
