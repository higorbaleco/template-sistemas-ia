<!-- @dsCard group="Colors" viewport="700x240" name="Surfaces & Text" subtitle="Off-white page, white cards, near-black text" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:22px;color:var(--t1);font-family:var(--font-ui)}
.sw{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap}
.chip{border-radius:14px;border:1px solid var(--gbo);overflow:hidden;min-width:150px;flex:1;background:var(--surface-card);box-shadow:var(--shadow-card)}
.chip .cap{height:66px}.chip .meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.hex{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.nm{font-size:12px;font-weight:700;color:var(--t1)}
.tk{font-size:11px;color:var(--t2)}</style></head><body>
<div class="row">
<div class="chip"><div class="cap" style="background:#F7F6F5;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Page</span><span class="hex">#F7F6F5</span><span class="tk">var(--bg)</span></div></div><div class="chip"><div class="cap" style="background:#FFFFFF;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Card</span><span class="hex">#FFFFFF</span><span class="tk">var(--bg2)</span></div></div><div class="chip"><div class="cap" style="background:#EFEEEC;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Sunken</span><span class="hex">#EFEEEC</span><span class="tk">var(--surface-deep)</span></div></div><div class="chip"><div class="cap" style="background:#111114;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Text strong</span><span class="hex">#111114</span><span class="tk">var(--t1)</span></div></div><div class="chip"><div class="cap" style="background:#45464A;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Text body</span><span class="hex">#45464A</span><span class="tk">var(--t2)</span></div></div><div class="chip"><div class="cap" style="background:#6E6F76;border-bottom:1px solid var(--gbo)"></div><div class="meta"><span class="nm">Text muted</span><span class="hex">#6E6F76</span><span class="tk">var(--t3)</span></div></div>
</div></body></html>
