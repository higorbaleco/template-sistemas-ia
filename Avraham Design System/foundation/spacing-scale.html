<!-- @dsCard group="Spacing" viewport="700x210" name="Base Scale" subtitle="8px base grid, sp-1 through sp-16" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:22px;color:var(--t1);font-family:var(--font-ui)}
.sw{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap}
.chip{border-radius:14px;border:1px solid var(--gbo);overflow:hidden;min-width:150px;flex:1}
.chip .cap{height:66px}.chip .meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px;background:var(--gb)}
.hex{font-family:var(--font-ui);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.nm{font-size:12px;font-weight:700;color:var(--t1)}
.tk{font-size:11px;color:var(--t2)}</style></head><body>
<div class="sw" style="gap:10px">
<div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-1</span><span style="height:14px;width:4px;background:var(--cyan);border-radius:3px"></span><span class="tk">4px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-2</span><span style="height:14px;width:8px;background:var(--cyan);border-radius:3px"></span><span class="tk">8px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-3</span><span style="height:14px;width:12px;background:var(--cyan);border-radius:3px"></span><span class="tk">12px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-4</span><span style="height:14px;width:16px;background:var(--cyan);border-radius:3px"></span><span class="tk">16px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-6</span><span style="height:14px;width:24px;background:var(--cyan);border-radius:3px"></span><span class="tk">24px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-8</span><span style="height:14px;width:32px;background:var(--cyan);border-radius:3px"></span><span class="tk">32px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-12</span><span style="height:14px;width:48px;background:var(--cyan);border-radius:3px"></span><span class="tk">48px</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tk" style="width:74px">--sp-16</span><span style="height:14px;width:64px;background:var(--cyan);border-radius:3px"></span><span class="tk">64px</span></div>
</div></body></html>
