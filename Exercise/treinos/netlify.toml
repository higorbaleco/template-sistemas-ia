# Netlify configuration for Catálogo de Treinos PWA

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_ENV = "production", VITE_APP_VERSION = "1.0.0" }

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production environment settings
[context.production]
  environment = { NODE_ENV = "production" }
  command = "npm run build"

# Deploy preview settings
[context.deploy-preview]
  environment = { NODE_ENV = "production" }
  command = "npm run build"

# Branch deploy settings
[context.branch-deploy]
  environment = { NODE_ENV = "development" }
  command = "npm run build"

# Cache headers for PWA manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "application/manifest+json"

# Service Worker should never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, no-store"
    Service-Worker-Allowed = "/"
    Content-Type = "application/javascript"

# Workbox runtime cache
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Assets (JS, CSS) - long cache with hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - no cache for index
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Icons - long cache
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
