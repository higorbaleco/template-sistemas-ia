[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_ENV = "production", VITE_APP_VERSION = "1.0.0" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

# Cache headers for Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# Cache headers for Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"
    Content-Type = "application/javascript"

# Cache headers for generated SW precache manifest
[[headers]]
  for = "/precache-manifest-*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Long-term caching for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts from Google Fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirects for offline fallback (optional, if you have offline.html)
# [[redirects]]
#   from = "/offline"
#   to = "/offline.html"
#   status = 200
