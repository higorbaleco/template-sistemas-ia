<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar Backend - Ferramenta Consulta</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f1117;
      color: #e8eaed;
    }
    .wrap {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
    }
    .card {
      background: #1b2230;
      border: 1px solid #2f3a52;
      border-radius: 12px;
      padding: 16px;
    }
    label {
      font-size: 13px;
      color: #b9c4d4;
      display: block;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #34425d;
      border-radius: 8px;
      background: #111827;
      color: #e8eaed;
      font-size: 14px;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      border: 1px solid #3a4664;
      background: #212b3f;
      color: #e8eaed;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .hint {
      font-size: 12px;
      color: #9aa5b4;
      margin-top: 10px;
    }
    .feedback {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
    .feedback.success { color: #34d399; }
    .feedback.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Configuração da Extensão</h1>
    <div class="card">
      <label for="backend-url">URL do backend local</label>
      <input id="backend-url" type="text" placeholder="http://127.0.0.1:5050">
      <div class="actions">
        <button class="primary" id="btn-save">Salvar</button>
        <button id="btn-default">Usar padrão</button>
      </div>
      <div class="hint">
        Exemplo: <strong>http://127.0.0.1:5050</strong> ou <strong>http://localhost:5050</strong>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
