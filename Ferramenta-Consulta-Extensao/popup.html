<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferramenta Consulta</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #10131b;
      color: #e8eaed;
      width: 320px;
    }
    .wrap {
      padding: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card {
      background: #1b2230;
      border: 1px solid #2f3a52;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .line {
      font-size: 12px;
      color: #c8d1dc;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .status {
      font-size: 12px;
      font-weight: 600;
    }
    .status.online { color: #34d399; }
    .status.offline { color: #f87171; }
    .stats {
      margin-top: 8px;
      font-size: 12px;
      color: #a6b2c2;
    }
    .actions {
      display: grid;
      gap: 8px;
    }
    button {
      width: 100%;
      border: 1px solid #3a4664;
      background: #212b3f;
      color: #e8eaed;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    button.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    button:hover {
      filter: brightness(1.08);
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #9aa5b4;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Ferramenta Consulta</div>

    <div class="card">
      <div class="line">Backend: <span id="backend-url">-</span></div>
      <div class="status offline" id="status-text">Offline</div>
      <div class="stats" id="stats-text">Sem conexão com o backend.</div>
    </div>

    <div class="actions">
      <button class="primary" id="btn-open">Abrir painel</button>
      <button id="btn-refresh">Atualizar status</button>
      <button id="btn-options">Configurar URL</button>
    </div>

    <div class="hint">
      Se estiver offline, abra a ferramenta pelo atalho
      <strong>Abrir Ferramenta.command</strong>.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
