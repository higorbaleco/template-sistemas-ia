<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .community-0 { fill: #FF6B6B; }
      .community-1 { fill: #4ECDC4; }
      .community-3 { fill: #45B7D1; }
      .community-4 { fill: #96CEB4; }
      .community-5 { fill: #FFEAA7; }
      .node-text { font-size: 11px; fill: white; text-anchor: middle; font-weight: 500; }
      .edge { stroke: #8b95a5; stroke-width: 1; opacity: 0.3; }
      .title { font-size: 24px; fill: white; font-weight: bold; }
      .subtitle { font-size: 14px; fill: #8b95a5; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f1419"/>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Knowledge Graph - Antigravity Software</text>
  <text x="600" y="60" class="subtitle" text-anchor="middle">Token Efficiency Stack · Architecture · Projects</text>
  
  <!-- Node Groups -->
  <!-- Token Efficiency Community -->
  <circle cx="150" cy="200" r="40" class="community-0"/>
  <text x="150" y="205" class="node-text">RTK</text>
  
  <circle cx="270" cy="200" r="40" class="community-0"/>
  <text x="270" y="205" class="node-text">context-mode</text>
  
  <circle cx="390" cy="200" r="40" class="community-0"/>
  <text x="390" y="205" class="node-text">claude-mem</text>
  
  <circle cx="510" cy="200" r="40" class="community-0"/>
  <text x="510" y="205" class="node-text">artifact-design</text>
  
  <!-- Project Template -->
  <circle cx="650" cy="200" r="45" class="community-1"/>
  <text x="650" y="200" class="node-text">template</text>
  <text x="650" y="215" class="node-text">operacao IA</text>
  
  <!-- Backend Tech -->
  <circle cx="150" cy="400" r="40" class="community-3"/>
  <text x="150" y="405" class="node-text">Python</text>
  
  <circle cx="270" cy="400" r="40" class="community-3"/>
  <text x="270" y="405" class="node-text">PostgreSQL</text>
  
  <circle cx="390" cy="400" r="40" class="community-3"/>
  <text x="390" y="405" class="node-text">Redis</text>
  
  <!-- Architecture -->
  <circle cx="650" cy="400" r="40" class="community-4"/>
  <text x="650" y="405" class="node-text">API Layer</text>
  
  <circle cx="770" cy="400" r="40" class="community-4"/>
  <text x="770" y="405" class="node-text">Domain</text>
  
  <!-- Design & Projects -->
  <circle cx="1050" cy="300" r="45" class="community-5"/>
  <text x="1050" y="295" class="node-text">Design</text>
  <text x="1050" y="310" class="node-text">Tokens</text>
  
  <circle cx="1050" cy="450" r="45" class="community-5"/>
  <text x="1050" y="450" class="node-text">Protected</text>
  <text x="1050" y="465" class="node-text">Projects</text>
  
  <!-- Edges (samples) -->
  <line x1="150" y1="240" x2="270" y2="240" class="edge"/>
  <line x1="270" y1="240" x2="390" y2="240" class="edge"/>
  <line x1="390" y1="240" x2="510" y2="240" class="edge"/>
  <line x1="510" y1="240" x2="650" y2="240" class="edge"/>
  
  <line x1="150" y1="240" x2="150" y2="360" class="edge"/>
  <line x1="270" y1="240" x2="270" y2="360" class="edge"/>
  <line x1="390" y1="240" x2="390" y2="360" class="edge"/>
  
  <line x1="650" y1="245" x2="650" y2="360" class="edge"/>
  <line x1="650" y1="440" x2="770" y2="440" class="edge"/>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="600" width="1100" height="170" fill="#1a2332" stroke="#2a3f5f" stroke-width="1" rx="4"/>
    
    <text x="70" y="625" class="title" text-anchor="start">Communities</text>
    
    <circle cx="70" cy="660" r="8" class="community-0"/>
    <text x="90" y="665" class="subtitle" text-anchor="start">Token Efficiency (0.94) - RTK, context-mode, claude-mem, artifact-design</text>
    
    <circle cx="70" cy="690" r="8" class="community-1"/>
    <text x="90" y="695" class="subtitle" text-anchor="start">Project Template (0.91) - operacao IA, principles, agents</text>
    
    <circle cx="550" cy="660" r="8" class="community-3"/>
    <text x="570" y="665" class="subtitle" text-anchor="start">Backend Tech (0.88) - Python, PostgreSQL, Redis, FastAPI</text>
    
    <circle cx="550" cy="690" r="8" class="community-4"/>
    <text x="570" y="695" class="subtitle" text-anchor="start">Architecture (0.87) - API Layer, Domain, Services, Workers</text>
    
    <circle cx="900" cy="660" r="8" class="community-5"/>
    <text x="920" y="665" class="subtitle" text-anchor="start">Design & Projects (0.85)</text>
  </g>
  
  <!-- Stats -->
  <g id="stats">
    <text x="1050" y="735" style="font-size: 12px; fill: #8b95a5; text-anchor: end;">79 nodes • 69 edges • 6 communities • 24 files</text>
    <text x="1050" y="755" style="font-size: 12px; fill: #8b95a5; text-anchor: end;">Generated: 2026-08-14 | Multi-agent semantic extraction</text>
  </g>
</svg>
