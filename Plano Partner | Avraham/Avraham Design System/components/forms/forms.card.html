<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>

<style>body{background:var(--bg-page);padding:20px;font-family:var(--font-body)}#root{display:block}</style></head><body><div id="root"></div><script type="text/babel">
const NS=window.AvrahamDesignSystem_609133;
const {Input,Select,Toggle,Tabs}=NS;
function Demo(){const[tab,setTab]=React.useState('todos');const[on,setOn]=React.useState(true);
return(<div style={{display:'flex',flexDirection:'column',gap:18}}>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
    <Input label="E-mail do convidado" placeholder="nome@empresa.com" icon="mail"/>
    <Input label="Número WhatsApp" placeholder="+55 66 99215-0873" icon="phone" hint="API oficial · Meta aprovada"/>
    <Select label="Responsável" options={['Higor Plens','Ana Lima','Bia Souza']}/>
  </div>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
    <Input placeholder="Buscar contato, organização ou deal" icon="search"/>
    <Input label="Domínio" value="avraham" error="Domínio já utilizado"/>
  </div>
  <div style={{display:'flex',gap:28,flexWrap:'wrap',alignItems:'center'}}>
    <Toggle checked={on} onChange={setOn} label="Disparos em massa" description="Permite criar e enviar campanhas"/>
    <Toggle checked={false} label="Exportar base" description="Somente administradores"/>
  </div>
  <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'center'}}>
    <Tabs tabs={[{value:'todos',label:'Todos',count:847},{value:'ia',label:'IA',count:194},{value:'humano',label:'Humano',count:63}]} value={tab} onChange={setTab}/>
    <Tabs variant="underline" tabs={[{value:'a',label:'Visão geral',icon:'layout-dashboard'},{value:'b',label:'Atividade',icon:'activity'},{value:'c',label:'Notas',icon:'sticky-note'}]} value="a"/>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
requestAnimationFrame(()=>window.lucide&&window.lucide.createIcons());
setTimeout(()=>window.lucide&&window.lucide.createIcons(),120);
</script></body></html>
