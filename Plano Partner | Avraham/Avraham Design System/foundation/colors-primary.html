<!-- @dsCard group="Colors" viewport="700x230" name="Primary Palette" subtitle="Emerald green primary, lavender secondary, semantics" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:22px;color:var(--t1);font-family:var(--font-ui)}
.sw{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap}
.chip{border-radius:14px;border:1px solid var(--gbo);overflow:hidden;min-width:150px;flex:1;background:var(--surface-card);box-shadow:var(--shadow-card)}
.chip .cap{height:66px}.chip .meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.hex{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.nm{font-size:12px;font-weight:700;color:var(--t1)}
.tk{font-size:11px;color:var(--t2)}</style></head><body>
<div class="row">
<div class="chip"><div class="cap" style="background:#0BBCA2"></div><div class="meta"><span class="nm">Emerald · primary</span><span class="hex">#0BBCA2</span><span class="tk">var(--emerald-500)</span></div></div><div class="chip"><div class="cap" style="background:#7C5C9E"></div><div class="meta"><span class="nm">Lavender · secondary</span><span class="hex">#7C5C9E</span><span class="tk">var(--lavender-500)</span></div></div><div class="chip"><div class="cap" style="background:#4B227A"></div><div class="meta"><span class="nm">Purple · deep</span><span class="hex">#4B227A</span><span class="tk">var(--lavender-700)</span></div></div><div class="chip"><div class="cap" style="background:#E8A13A"></div><div class="meta"><span class="nm">Amber · warning</span><span class="hex">#E8A13A</span><span class="tk">var(--amber)</span></div></div><div class="chip"><div class="cap" style="background:#F0555B"></div><div class="meta"><span class="nm">Coral · alert</span><span class="hex">#F0555B</span><span class="tk">var(--coral)</span></div></div>
</div></body></html>
