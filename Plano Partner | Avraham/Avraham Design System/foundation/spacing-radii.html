<!-- @dsCard group="Spacing" viewport="700x190" name="Radii & Bracket" subtitle="Card/button radii and the bracket accent" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:22px;color:var(--t1);font-family:var(--font-ui)}
.sw{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap}
.chip{border-radius:14px;border:1px solid var(--gbo);overflow:hidden;min-width:150px;flex:1}
.chip .cap{height:66px}.chip .meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px;background:var(--gb)}
.hex{font-family:var(--font-ui);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.nm{font-size:12px;font-weight:700;color:var(--t1)}
.tk{font-size:11px;color:var(--t2)}</style></head><body>
<div class="row" style="align-items:stretch">
<div style="flex:1;min-width:120px;background:var(--gb);border:1px solid var(--gbo);border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:76px"><span class="nm">Card</span><span class="tk">20px · var(--rc)</span></div><div style="flex:1;min-width:120px;background:var(--gb);border:1px solid var(--gbo);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:76px"><span class="nm">Button</span><span class="tk">12px · var(--rb)</span></div><div style="flex:1;min-width:120px;background:var(--gb);border:1px solid var(--gbo);border-radius:999px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:76px"><span class="nm">Pill</span><span class="tk">999px · var(--r-pill)</span></div>
<div class="bracket" style="flex:1.2;min-width:150px;background:var(--gb);border:1px solid var(--gbo);border-radius:16px;padding:16px 16px 16px 24px;display:flex;flex-direction:column;justify-content:center"><span class="nm">Bracket accent</span><span class="tk" style="margin-top:4px">floating pill bar, never a straight border-left</span></div>
</div></body></html>
