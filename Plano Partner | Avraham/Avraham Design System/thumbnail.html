<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}#tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-ui)}
.main{flex:1;position:relative;background:#F7F6F5;display:flex;align-items:center;justify-content:center}
.main::after{content:"";position:absolute;inset:0;background:var(--grad-command)}
.mark{position:relative;font-weight:800;font-size:150px;letter-spacing:-.04em;color:#111114;line-height:1}
.logo{max-width:450px;max-height:200px;object-fit:contain;position:relative;z-index:1}
.strip{width:300px;display:flex;flex-direction:column}
.strip span{flex:1}
</style></head><body><div id="tile">
<div class="main"><img src="uploads/03 fundo branco letra preta.png" class="logo" alt="Avraham"></div>
<div class="strip">
<span style="background:#00eed0"></span>
<span style="background:#0BBCA2"></span>
<span style="background:#7C5C9E"></span>
<span style="background:#4b227a"></span>
</div></div></body></html>
